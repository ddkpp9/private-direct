name: "网络出口状态"
description: "显示直连与 Egern 当前策略的公网 IPv4/IPv6、国家省市，以及当前 Wi-Fi/蜂窝接口地址；代理无 IPv6 时自动隐藏"
author: "ddkpp9"
homepage: "https://github.com/ddkpp9/private-direct"

env_schema:
  proxyPolicy:
    name: 代理策略组
    description: "留空时按 Egern 当前规则探测；若代理结果与直连相同，请填写实际代理或策略组名称"
    default_value: ""
  refreshMinutes:
    name: 刷新间隔（分钟）
    description: "请求系统在该时间后刷新；实际刷新时刻由 iOS 调度"
    default_value: "10"

scriptings:
- generic:
    name: 网络出口状态
    script_url: https://raw.githubusercontent.com/ddkpp9/private-direct/b81aae7301c790738a0bf38bf9df0efbafa15d67/modules/network-ip-widget.js
    timeout: 25

widgets:
- name: 网络出口状态
  script_name: 网络出口状态
